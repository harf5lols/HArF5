        .game {

            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .game:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #FF007F; /* Soft pink glow effect */
        }
        .game a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            display: block;
        }
        .game h2 {
            margin: 0;
        }
        .back-link {
