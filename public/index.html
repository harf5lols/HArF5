<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HArF 5</title>

<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>

<script src="register-sw.js" defer></script>
<script src="search.js" defer></script>
<script src="index.js" defer></script>

<style>
body{
    margin:0;
    font-family:Comic Sans MS;
    background:#FF69D0;
    text-align:center;
    overflow:hidden;
}

.title{
    margin-top:60px;
    font-size:60px;
    color:#ffffff;
    position:relative;
    z-index:2;
}

.links{
    margin:10px;
    color:#ffffff;
    position:relative;
    z-index:2;
}

.links a{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.search-box{
    margin-top:40px;
    position:relative;
    z-index:2;
}

.search-box input{
    width:400px;
    padding:15px;
    border-radius:25px;
    border:none;
    font-size:16px;
    outline:none;
}

.circle{
    position:absolute;
    border-radius:50%;
    opacity:0.3;
}

.c1{width:300px;height:300px;background:white;left:35%;top:200px;}
.c2{width:300px;height:300px;background:lightblue;left:50%;top:200px;}
.c3{width:300px;height:300px;background:purple;left:42%;top:300px;}

.footer{
    position:fixed;
    bottom:10px;
    width:100%;
    color:white;
    font-size:14px;
    z-index:2;
}
</style>
</head>

<body>

<div class="title">HArF 5</div>

<div class="links">
<a href="https://discord.gg/NHuADvevz" target="_blank">Discord Server</a>
</div>

<form id="sj-form" class="search-box">
    <input
        id="sj-search-engine"
        value="https://www.google.com/search?q=%s"
        type="hidden"
    />

    <input
        id="sj-address"
        type="text"
        placeholder="Enter Link Here.."
    />
</form>

<p id="sj-error"></p>
<pre id="sj-error-code"></pre>

<div class="footer">
Powered by Scramjet, HArF 5 Beta 1
</div>

<script>
const observer = new MutationObserver(() => {
    const frame = document.getElementById("sj-frame");

    if (frame) {
        document.body.classList.add("proxy-active");

        Object.assign(frame.style, {
            position: "fixed",
            inset: "0",
            width: "100vw",
            height: "100vh",
            zIndex: "2147483647",
            border: "none"
        });
    }
});

observer.observe(document.body, {
    childList: true,
    subtree: true
});
</script>

<script>

observer.observe(document.body, {

</script>

</body>
</html>
